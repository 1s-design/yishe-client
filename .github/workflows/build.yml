name: Build and Release Electron App

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - electron-builder.yml
      - electron.vite.config.ts
      - src/main/externalProcessConfig.ts
      - src/main/ps-automation/**
      - src/main/image-tool/**
      - src/main/video-template/**
      - scripts/download-latest-plugins.mjs
      - scripts/prepare-ps-env.mjs
      - scripts/prepare-ps-binary.mjs
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version_check.outputs.changed }}
      version: ${{ steps.version_check.outputs.version }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if package.json version changed
        id: version_check
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const before = context.payload.before;
            const isAllZero = (sha) => typeof sha === 'string' && /^0+$/.test(sha);

            const currentPkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const currentVersion = currentPkg.version;

            let previousVersion = null;
            if (before && !isAllZero(before)) {
              try {
                const prevPkgText = execSync(`git show ${before}:package.json`, { encoding: 'utf8' });
                previousVersion = JSON.parse(prevPkgText).version ?? null;
              } catch (e) {
                core.warning(`无法读取上一个提交的 package.json：${e.message}`);
              }
            }

            const changed = previousVersion === null ? true : (previousVersion !== currentVersion);
            core.info(`previousVersion=${previousVersion ?? '(unknown)'}, currentVersion=${currentVersion}, changed=${changed}`);
            core.setOutput('changed', String(changed));
            core.setOutput('version', currentVersion);

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            build_args: --mac dmg --config electron-builder.yml
            prepare_plugins_cmd: npm run prepare:plugins:mac
            csc_identity_auto_discovery: "true"
            artifact_path: release/yishe-client.dmg
            cos_platform: mac
            cos_filename: latest.dmg
          - os: windows-latest
            build_args: --win portable --config electron-builder.yml
            prepare_plugins_cmd: npm run prepare:plugins:win
            csc_identity_auto_discovery: ""
            artifact_path: release/yishe-client.exe
            cos_platform: windows
            cos_filename: latest.exe

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Python for PS automation
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: src/main/ps-automation/requirements.txt

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || (echo "Retry 1..." && sleep 10 && npm ci --legacy-peer-deps) || (echo "Retry 2..." && sleep 10 && npm ci --legacy-peer-deps)

      - name: Clean managed plugins before build
        run: npm run clean:plugins

      - name: Download managed plugins for current platform build
        run: ${{ matrix.prepare_plugins_cmd }}

      - name: Build PS automation executable
        if: runner.os == 'Windows'
        run: npm run prepare:ps:env && npm run prepare:ps:win

      - name: Verify PS automation executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @(
            "resources/plugin/win32/yishe-ps-windows.exe",
            "resources/plugin/win32/ps-automation/yishe-ps-windows.exe"
          )
          foreach ($path in $paths) {
            if (-not (Test-Path $path)) {
              throw "PS automation executable not found: $path"
            }
            Write-Host "Found $path"
          }

      - name: Build app
        run: npm run build

      - name: Reset Electron builder cache
        shell: bash
        run: |
          rm -rf release "$RUNNER_TEMP/electron-cache" "$RUNNER_TEMP/electron-builder-cache"
          mkdir -p "$RUNNER_TEMP/electron-cache" "$RUNNER_TEMP/electron-builder-cache"

      - name: Package Electron app
        run: npx electron-builder ${{ matrix.build_args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.github_token }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.csc_identity_auto_discovery }}
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      # 在各自原生 Runner 上构建后，统一使用固定文件名暂存产物。
      # 后续 COS job 仅在 macOS + Windows 均构建成功时才覆盖 latest 文件，避免半发布状态。
      - name: Stage fixed COS artifact
        shell: bash
        run: |
          mkdir -p "cos-upload/${{ matrix.cos_platform }}"
          cp "${{ matrix.artifact_path }}" "cos-upload/${{ matrix.cos_platform }}/${{ matrix.cos_filename }}"

      - name: Upload COS staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: cos-${{ matrix.cos_platform }}
          path: cos-upload/${{ matrix.cos_platform }}/${{ matrix.cos_filename }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false
          files: ${{ matrix.artifact_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}

  # COS 只保存两个稳定下载路径。构建产物通过 Actions Artifact 汇总，
  # 确保 macOS 与 Windows 均构建成功后才覆盖最新版，避免只更新其中一个平台。
  #
  # 超时策略（防止 cos-nodejs-sdk-v5 在无网络响应时无限 hang）：
  #   1. job 级 timeout-minutes: 10（GitHub 硬上限，超时整个 job 失败）
  #   2. 每个上传步骤 timeout-minutes: 4（单步卡死则快速失败）
  #   3. COS_TIMEOUT=30000（SDK socket 超时 30 秒，cos-nodejs-sdk-v5 支持该环境变量）
  #   4. 上传前用 curl 探测 COS endpoint 连通性，不通则立即失败并给出诊断信息
  #   5. 上传前校验 secret 非空，避免空密钥导致 SDK 卡在签名等待
  publish-cos:
    needs: [check-version, build]
    if: success() && needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: cos-mac
          path: cos-upload/mac

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: cos-windows
          path: cos-upload/windows

      - name: Verify COS packages
        shell: bash
        run: |
          test -s cos-upload/mac/latest.dmg
          test -s cos-upload/windows/latest.exe

      - name: Validate COS secrets are present
        shell: bash
        run: |
          miss=()
          [[ -n "${{ secrets.TENCENT_SECRET_ID }}" ]] || miss+=("TENCENT_SECRET_ID")
          [[ -n "${{ secrets.TENCENT_SECRET_KEY }}" ]] || miss+=("TENCENT_SECRET_KEY")
          [[ -n "${{ secrets.TENCENT_COS_BUCKET }}" ]] || miss+=("TENCENT_COS_BUCKET")
          [[ -n "${{ secrets.TENCENT_COS_REGION }}" ]] || miss+=("TENCENT_COS_REGION")
          if [[ ${#miss[@]} -gt 0 ]]; then
            echo "::error::缺少以下 GitHub Secret，无法上传 COS：${miss[*]}。请到仓库 Settings → Secrets and variables → Actions 中补全。"
            exit 1
          fi
          echo "COS secrets 校验通过"

      - name: Probe COS endpoint connectivity
        id: probe
        shell: bash
        timeout-minutes: 1
        run: |
          REGION="${{ secrets.TENCENT_COS_REGION }}"
          BUCKET="${{ secrets.TENCENT_COS_BUCKET }}"
          # 构造 COS 默认 endpoint（cos.<region>.myqcloud.com）
          ENDPOINT="https://${BUCKET}.cos.${REGION}.myqcloud.com"
          echo "探测 COS endpoint: $ENDPOINT"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$ENDPOINT" || echo "000")
          echo "http_code=$HTTP_CODE"
          if [[ "$HTTP_CODE" == "000" ]]; then
            echo "::error::无法连接到 COS endpoint（$ENDPOINT），网络不通或 DNS 解析失败。请检查：1) cos_region 是否正确（如 ap-guangzhou）；2) bucket 名称是否拼写正确；3) GitHub Runner 到腾讯云的网络是否被防火墙拦截。"
            exit 1
          fi
          # 403/404 都说明 endpoint 可达（只是匿名访问被拒或根目录不存在），视为连通
          if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 500 ]]; then
            echo "COS endpoint 可达 (HTTP $HTTP_CODE)"
          else
            echo "::warning::COS endpoint 返回 HTTP $HTTP_CODE，继续尝试上传"
          fi

      - name: Upload macOS latest package to Tencent COS
        timeout-minutes: 4
        uses: TencentCloud/cos-action@v1
        env:
          # cos-nodejs-sdk-v5 支持 COS_TIMEOUT 环境变量（毫秒），控制 socket 超时
          COS_TIMEOUT: "30000"
        with:
          secret_id: ${{ secrets.TENCENT_SECRET_ID }}
          secret_key: ${{ secrets.TENCENT_SECRET_KEY }}
          cos_bucket: ${{ secrets.TENCENT_COS_BUCKET }}
          cos_region: ${{ secrets.TENCENT_COS_REGION }}
          local_path: cos-upload/mac
          remote_path: yishe-client/mac

      - name: Upload Windows latest package to Tencent COS
        timeout-minutes: 4
        uses: TencentCloud/cos-action@v1
        env:
          COS_TIMEOUT: "30000"
        with:
          secret_id: ${{ secrets.TENCENT_SECRET_ID }}
          secret_key: ${{ secrets.TENCENT_SECRET_KEY }}
          cos_bucket: ${{ secrets.TENCENT_COS_BUCKET }}
          cos_region: ${{ secrets.TENCENT_COS_REGION }}
          local_path: cos-upload/windows
          remote_path: yishe-client/windows

  # electron-builder 仍会附带 latest*.yml、blockmap 等；仅保留固定文件名的两枚安装包，便于 https://github.com/.../releases/latest/download/ 稳定直链
  prune-release-assets:
    needs: [check-version, build]
    if: success() && needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Remove extra release assets
        uses: actions/github-script@v7
        with:
          script: |
            const keep = new Set([
              'yishe-client.exe',
              'yishe-client.dmg',
            ]);
            const tag = `v${{ needs.check-version.outputs.version }}`;

            let release;
            try {
              const res = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              release = res.data;
            } catch (e) {
              core.warning(`未找到 tag ${tag} 的 release，跳过修剪：${e.message}`);
              return;
            }

            const assets = release.assets || [];
            for (const asset of assets) {
              if (keep.has(asset.name)) continue;
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              });
              core.info(`已删除 release 附加文件: ${asset.name}`);
            }

  notify-feishu:
    needs: [check-version, build]
    if: always() && needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Send Feishu Notification
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.build.result }}';
            const emoji = status === 'success' ? '🚀' : '❌';
            const commitSha = '${{ github.sha }}'.substring(0, 7);

            const message = {
              msg_type: "text",
              content: {
                text: `${emoji} 衣设Electron应用构建${status === 'success' ? '成功' : '失败'}通知\n\n` +
                      `项目: ${{ github.repository }}\n` +
                      `分支: main\n` +
                      `提交: ${commitSha}\n` +
                      `矩阵: macOS + Windows（单条通知汇总）\n` +
                      `提交者: ${{ github.actor }}\n` +
                      `提交信息: ${{ github.event.head_commit.message }}\n` +
                      `构建时间: ${new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' })}\n` +
                      `状态: ${status === 'success' ? '✅ 成功' : '❌ 失败'}\n\n` +
                      `Windows 固定地址: https://github.com/${{ github.repository }}/releases/latest/download/yishe-client.exe\n` +
                      `macOS 固定地址: https://github.com/${{ github.repository }}/releases/latest/download/yishe-client.dmg\n` +
                      `统一说明: 当前仅提供一套客户端安装包，浏览器自动化已内置到客户端中。\n` +
                      `支持平台: 抖音、小红书、微博、快手、咸鱼、速卖通、亚马逊、希音\n` +
                      `注意: 仓库为私有，但 releases 可设置为公开访问`
              },
            };

            await fetch('${{ secrets.FEISHU_WEBHOOK_URL }}', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(message),
            });
