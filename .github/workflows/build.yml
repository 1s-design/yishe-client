name: Build and Release Electron App

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - electron-builder.yml
      - electron.vite.config.ts
      - src/main/externalProcessConfig.ts
      - src/main/ps-automation/**
      - src/main/image-tool/**
      - src/main/video-template/**
      - scripts/download-latest-plugins.mjs
      - scripts/prepare-ps-env.mjs
      - scripts/prepare-ps-binary.mjs
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version_check.outputs.changed }}
      version: ${{ steps.version_check.outputs.version }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if package.json version changed
        id: version_check
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const before = context.payload.before;
            const isAllZero = (sha) => typeof sha === 'string' && /^0+$/.test(sha);

            const currentPkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const currentVersion = currentPkg.version;

            let previousVersion = null;
            if (before && !isAllZero(before)) {
              try {
                const prevPkgText = execSync(`git show ${before}:package.json`, { encoding: 'utf8' });
                previousVersion = JSON.parse(prevPkgText).version ?? null;
              } catch (e) {
                core.warning(`无法读取上一个提交的 package.json：${e.message}`);
              }
            }

            const changed = previousVersion === null ? true : (previousVersion !== currentVersion);
            core.info(`previousVersion=${previousVersion ?? '(unknown)'}, currentVersion=${currentVersion}, changed=${changed}`);
            core.setOutput('changed', String(changed));
            core.setOutput('version', currentVersion);

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            build_args: --mac dmg --config electron-builder.yml
            prepare_plugins_cmd: npm run prepare:plugins:mac
            csc_identity_auto_discovery: "true"
            artifact_path: release/yishe-client.dmg
          - os: windows-latest
            build_args: --win portable --config electron-builder.yml
            prepare_plugins_cmd: npm run prepare:plugins:win
            csc_identity_auto_discovery: ""
            artifact_path: release/yishe-client.exe

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Python for PS automation
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: src/main/ps-automation/requirements.txt

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || (echo "Retry 1..." && sleep 10 && npm ci --legacy-peer-deps) || (echo "Retry 2..." && sleep 10 && npm ci --legacy-peer-deps)

      - name: Clean managed plugins before build
        run: npm run clean:plugins

      - name: Download managed plugins for current platform build
        run: ${{ matrix.prepare_plugins_cmd }}

      - name: Build PS automation executable
        if: runner.os == 'Windows'
        run: npm run prepare:ps:env && npm run prepare:ps:win

      - name: Verify PS automation executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $paths = @(
            "resources/plugin/win32/yishe-ps-windows.exe",
            "resources/plugin/win32/ps-automation/yishe-ps-windows.exe"
          )
          foreach ($path in $paths) {
            if (-not (Test-Path $path)) {
              throw "PS automation executable not found: $path"
            }
            Write-Host "Found $path"
          }

      - name: Build app
        run: npm run build

      - name: Reset Electron builder cache
        shell: bash
        run: |
          rm -rf release "$RUNNER_TEMP/electron-cache" "$RUNNER_TEMP/electron-builder-cache"
          mkdir -p "$RUNNER_TEMP/electron-cache" "$RUNNER_TEMP/electron-builder-cache"

      - name: Package Electron app
        run: npx electron-builder ${{ matrix.build_args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.github_token }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.csc_identity_auto_discovery }}
          ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/